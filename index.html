<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Misión FYQ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0B1730;--p:#3685F5;--t:#20C7B5;--g:#34C78A;--o:#F3A847;--w:#F8FAFC;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 20% 10%,#16336b,var(--bg) 60%);color:var(--w);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:clamp(13px,1.35vw,19px);overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:56px 1fr 56px}
.bar{display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.12)}
.bar.b{border-top:1px solid rgba(255,255,255,.12);border-bottom:0;justify-content:center}
.logo{font-weight:800;color:var(--t);letter-spacing:.5px;white-space:nowrap}.sp{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--p);color:#fff;font-weight:600}
button:hover{filter:brightness(1.15)}button:disabled{opacity:.35;cursor:default}button:focus-visible,.fc:focus-visible{outline:3px solid var(--o)}
.g{background:var(--g);color:#052}.o{background:var(--o);color:#321}.n{background:rgba(255,255,255,.14)}
.tabs button{background:rgba(255,255,255,.1);border-radius:10px 10px 0 0}.tabs button.on{background:var(--t);color:#032}
main{min-height:0;padding:10px 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.two{flex:1;min-height:0;display:flex;gap:10px}.pn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px;min-height:0;min-width:0;overflow:auto;backdrop-filter:blur(6px)}
h2{margin:0 0 6px;color:var(--t);font-size:1.35em}p{margin:4px 0;line-height:1.4}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fc{perspective:800px;height:150px;cursor:pointer}.fi{position:relative;width:100%;height:100%;transition:transform .65s;transform-style:preserve-3d}.fc.f .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:8px;overflow:auto;text-align:center;font-size:.9em}
.fa{background:linear-gradient(135deg,var(--p),var(--t));display:flex;flex-direction:column;align-items:center;justify-content:center}.fa b{font-size:2.6em}
.fb{transform:rotateY(180deg);background:#12306a;border:2px solid var(--t);text-align:left}
.opt{display:block;width:100%;text-align:left;margin:4px 0;background:rgba(255,255,255,.12)}.opt.on{background:var(--p);outline:2px solid var(--w)}
input,select{font:inherit;padding:8px;border-radius:8px;border:1px solid #567;background:#0d2145;color:var(--w);width:100%}
.fb1{padding:8px;border-radius:10px;margin-top:6px}.ok{background:rgba(52,199,138,.25);border:1px solid var(--g)}.ko{background:rgba(243,168,71,.25);border:1px solid var(--o)}.hn{background:rgba(54,133,245,.25)}
.home{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-height:0}.mc{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px;cursor:pointer;transition:transform .2s}.mc:hover{transform:translateY(-4px);border-color:var(--t)}.mc span{font-size:2.2em}
table{border-collapse:collapse;width:100%}td,th{border:1px solid rgba(255,255,255,.25);padding:4px 6px}
canvas{width:100%;height:100%;display:block}.side{position:fixed;right:0;top:56px;bottom:56px;width:min(300px,90vw);background:#0d2145;border-left:2px solid var(--t);padding:10px;overflow:auto;z-index:9}
.side button{display:block;width:100%;margin:4px 0}.big{font-size:1.4em;font-weight:700}svg text{font-family:system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){.fi{transition:none}.mc{transition:none}}
.rm *{transition:none!important}
</style></head><body><div id="app"></div>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=x=>String(+(+x).toFixed(3)).replace('.',',');
const Q=(q,o,a,e,h,tag)=>({q,o,a,e,h:h||['Piensa qué propiedad o idea se pide.','Recuerda la teoría de la misión.','Descarta las opciones que no cumplen la definición.'],tag});
const MC=(q,c,w,e,h,tag,extra)=>{const o=sh([c,...w]);return Object.assign(Q(q,o,o.indexOf(c),e,h,tag),extra||{})};
const TF=(q,v,e,tag)=>Q(q,['Verdadero','Falso'],v?0:1,e,0,tag);
const MN=['Propiedades de la materia','Estados y teoría cinética','Comportamiento de los gases','Laboratorio de densidad','Cálculos y conversiones','Gráficas de calentamiento','Gran desafío final'];
const MI=['🧪','🔬','🎈','⚖️','🧮','📈','🏆'];
const CD={Materia:['Todo lo que tiene masa y ocupa espacio.','Una piedra, el aire, el agua.'],Masa:['Cantidad de materia de un cuerpo. Se mide en kg.','Una bolsa de arroz: 1 kg.'],Volumen:['Espacio que ocupa un cuerpo. Unidad SI: m³.','Una botella de 1 litro.'],Densidad:['Masa que hay en cada unidad de volumen. Es propiedad específica.','El aceite flota sobre el agua.'],Sólido:['Forma y volumen constantes; partículas muy juntas que vibran.','Hielo.'],Líquido:['Volumen constante y forma del recipiente.','Agua en un vaso.'],Gas:['Forma y volumen del recipiente; partículas muy separadas.','Vapor de agua.'],Temperatura:['Mide la agitación de las partículas.','En un té caliente las partículas se mueven más rápido.'],Presión:['Choques de las partículas de un gas contra las paredes.','Un balón inflado.'],Evaporación:['Líquido a gas solo en la superficie y a cualquier temperatura.','Un charco que se seca.'],Ebullición:['Líquido a gas en todo el líquido, a su temperatura de ebullición.','Agua hirviendo a 100 °C.'],Fusión:['Paso de sólido a líquido (absorbe calor).','Un cubito que se derrite.'],Solidificación:['Paso de líquido a sólido (libera calor).','Agua en el congelador.'],'Boyle-Mariotte':['Temperatura constante: si el volumen disminuye, la presión aumenta (relación inversa).','Apretar una jeringa tapada.'],Charles:['Presión constante: si sube la temperatura, sube el volumen (relación directa).','Un globo al sol.'],'Gay-Lussac':['Volumen constante: si sube la temperatura, sube la presión (relación directa).','Un bote de spray cerca del fuego.']};
const cards=n=>n.map(k=>`<div class=fc tabindex=0 role=button onclick="this.classList.toggle('f')" onkeydown="if(event.key==='Enter')this.classList.toggle('f')"><div class=fi><div class=fa><b>?</b><small>Pulsa para descubrir</small></div><div class=fb><b>${k}</b><br>${CD[k][0]}<br><i>Ej.: ${CD[k][1]}</i></div></div></div>`).join('');
const L=[
[{t:'¿Qué es la materia?',x:'La materia es todo aquello que tiene <b>masa</b> y ocupa un <b>espacio</b> (volumen). La masa se mide con una balanza (kg) y el volumen en m³ o litros. El volumen no depende de la forma del recipiente.',c:['Materia','Masa','Volumen']},
{t:'Propiedades generales y específicas',x:'<b>Generales</b>: las tiene toda la materia y no sirven para identificarla (masa, volumen). <b>Específicas</b>: valor propio de cada sustancia, permiten identificarla (densidad, temperatura de ebullición).',c:['Densidad']},
{t:'Identificar materiales',x:'Dos vasos con 200 mL de líquido pueden contener agua o alcohol: el volumen no basta. Hay que comparar propiedades específicas, como la densidad o la temperatura de ebullición.'}],
[{t:'Estados de agregación',x:'<table><tr><th></th><th>Forma</th><th>Volumen</th></tr><tr><td>Sólido</td><td>Constante</td><td>Constante</td></tr><tr><td>Líquido</td><td>Del recipiente</td><td>Constante</td></tr><tr><td>Gas</td><td>Del recipiente</td><td>Del recipiente</td></tr></table>',c:['Sólido','Líquido','Gas']},
{t:'Teoría cinética',x:'La materia está formada por partículas muy pequeñas, con espacio vacío entre ellas, en continuo movimiento. Se atraen más en los sólidos y menos en los gases. Más temperatura = más agitación.',c:['Temperatura','Presión']},
{t:'Cambios de estado',x:'<svg viewBox="0 0 700 290" style="display:block;margin:0 auto;height:34vh;height:34dvh;max-width:100%"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ff4b3a" /></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f86ff" /></marker></defs><g fill="#c6f1ee" stroke="#20C7B5" stroke-width="3"><rect x="20" y="90" width="130" height="60" rx="8" /><rect x="285" y="90" width="130" height="60" rx="8" /><rect x="550" y="90" width="130" height="60" rx="8" /></g><g fill="#0B1730" font-size="22" font-weight="800" text-anchor="middle"><text x="85" y="128">SÓLIDO</text><text x="350" y="128">LÍQUIDO</text><text x="615" y="128">GASEOSO</text></g><g fill="none" stroke-width="5" stroke-linecap="round"><path d="M85 88V40H615V84" stroke="#ff4b3a" marker-end="url(#ar)" /><path d="M160 108H272" stroke="#ff4b3a" marker-end="url(#ar)" /><path d="M425 108H537" stroke="#ff4b3a" marker-end="url(#ar)" /><path d="M275 134H163" stroke="#2f86ff" marker-end="url(#ab)" /><path d="M540 134H428" stroke="#2f86ff" marker-end="url(#ab)" /><path d="M615 154V215H85V156" stroke="#2f86ff" marker-end="url(#ab)" /></g><g fill="#F8FAFC" font-size="18" font-weight="700" text-anchor="middle"><text x="350" y="28">Sublimación</text><text x="217" y="96">Fusión</text><text x="482" y="96">Vaporización</text><text x="217" y="162">Solidificación</text><text x="482" y="162">Condensación</text><text x="350" y="245">Sublimación inversa</text></g><g font-size="16" fill="#F8FAFC"><path d="M180 272H225" stroke="#ff4b3a" stroke-width="5" marker-end="url(#ar)" /><text x="235" y="278">Absorbe calor</text><path d="M420 272H465" stroke="#2f86ff" stroke-width="5" marker-end="url(#ab)" /><text x="475" y="278">Libera calor</text></g></svg>'},
{t:'Evaporación y ebullición',x:'La <b>evaporación</b> ocurre solo en la superficie y a cualquier temperatura. La <b>ebullición</b> ocurre en todo el líquido, a una temperatura concreta (el agua, 100 °C).',c:['Evaporación','Ebullición']}],
[{t:'Ley de Boyle-Mariotte',x:'Temperatura <b>constante</b>. Si el volumen disminuye, las partículas chocan más veces con las paredes y la presión <b>aumenta</b>. Relación <b>inversa</b> entre presión y volumen.',c:['Boyle-Mariotte']},
{t:'Ley de Charles',x:'Presión <b>constante</b>. Si la temperatura sube, las partículas se mueven más rápido y el volumen <b>aumenta</b>. Relación <b>directa</b> entre volumen y temperatura.',c:['Charles']},
{t:'Ley de Gay-Lussac',x:'Volumen <b>constante</b>. Si la temperatura sube, las partículas chocan más y con más fuerza y la presión <b>aumenta</b>. Relación <b>directa</b>.',c:['Gay-Lussac']},
{t:'Resumen',x:'<table><tr><th>Ley</th><th>Constante</th><th>Relación</th><th>Tipo</th></tr><tr><td>Boyle-Mariotte</td><td>Temperatura</td><td>Presión–Volumen</td><td>Inversa</td></tr><tr><td>Charles</td><td>Presión</td><td>Volumen–Temperatura</td><td>Directa</td></tr><tr><td>Gay-Lussac</td><td>Volumen</td><td>Presión–Temperatura</td><td>Directa</td></tr></table>'}],
[{t:'Medir masa y volumen',x:'La masa se mide con una <b>balanza</b>. El volumen de un líquido, con una <b>probeta</b>. Para un sólido irregular se usa el <b>desplazamiento de agua</b>: V del sólido = volumen final − volumen inicial.'},
{t:'Calcular la densidad',x:'<p class=big>d = m / V</p>Divide la masa entre el volumen. Compara materiales: dos piezas del mismo material tienen la misma densidad.'}],
[{t:'Fórmula y despejes',x:'<p class=big>d = m / V</p><p class=big>m = d × V</p><p class=big>V = m / d</p>Tapa la incógnita: lo que queda es la operación. Pasos: datos, fórmula, despeje, sustitución, operación, resultado y unidad.'},
{t:'Unidades y conversiones',x:'1 kg = 1000 g · 1 m³ = 1 000 000 cm³ · 1 mL = 1 cm³ · <b>1 g/cm³ = 1000 kg/m³</b>.<p>Si d &lt; 1 g/cm³ flota en agua; si d &gt; 1 se hunde.</p>'}],
[{t:'Leer una gráfica de calentamiento',x:'Eje horizontal: tiempo. Eje vertical: temperatura. Los tramos inclinados son calentamiento; las <b>mesetas</b> (horizontales) son cambios de estado. Pulsa los tramos de la gráfica.',gv:1},
{t:'Claves',x:'1.ª meseta = fusión; 2.ª meseta = ebullición. Duración = tiempo final − tiempo inicial de la meseta. No confundas duración (min) con temperatura (°C).'}],
[{t:'Gran desafío final',x:'Mezcla de todas las misiones. En la pestaña Practica elige RETO RÁPIDO (6), NORMAL (12) o COMPLETO (20). En Experimenta tienes todas las tarjetas de conceptos.'}]];
const B1=[MC('¿Cuál es una propiedad específica?','La densidad',['La masa','El volumen','La cantidad'],'La densidad tiene un valor propio para cada sustancia.',0,'Propiedades'),
MC('Pasamos 250 mL de agua de un vaso alto a uno ancho. ¿Qué NO cambia?','El volumen',['La forma del líquido','La altura','El aspecto del recipiente'],'La forma se adapta al recipiente, pero masa y volumen se conservan.',0,'Propiedades'),
MC('Dos cubos del mismo tamaño pero de distinto material. ¿Qué propiedad los distingue?','La densidad',['El volumen','Ocupar espacio','Tener masa'],'Tienen igual volumen; la densidad es específica.',0,'Propiedades'),
TF('La masa de una piedra cambia al calentarla.',0,'La masa no depende de la temperatura.','Propiedades'),
MC('La unidad de masa en el SI es…','El kilogramo',['El litro','El metro cúbico','El pascal'],'La masa se mide en kg; el volumen en m³.',0,'Propiedades'),
MC('La materia es todo lo que…','tiene masa y ocupa espacio',['se ve','pesa mucho','se puede tocar'],'El aire no se ve y es materia.',0,'Propiedades'),
TF('Dos líquidos con 100 mL son el mismo líquido.',0,'El volumen es propiedad general: no identifica la sustancia.','Propiedades'),
MC('¿Con qué instrumento medimos la masa?','Balanza',['Probeta','Termómetro','Manómetro'],'La balanza mide masa.',0,'Propiedades')];
const B2=[MC('Forma y volumen constantes:','Sólido',['Líquido','Gas','Ninguno'],'Solo el sólido tiene ambos constantes.',0,'Estados'),
MC('Las partículas de un gas están…','muy separadas y en movimiento libre',['muy juntas y quietas','ordenadas y vibrando','pegadas'],'Hay mucho espacio vacío.',0,'Estados'),
MC('Al aumentar la temperatura, las partículas…','se mueven más rápido',['se detienen','se hacen más grandes','se atraen más'],'La temperatura mide la agitación.',0,'Estados'),
MC('La presión de un gas se debe a…','los choques de las partículas con las paredes',['su peso','su color','su masa solo'],'Más choques, más presión.',0,'Estados'),
MC('Paso de líquido a gas:','Vaporización',['Fusión','Condensación','Solidificación'],'Vaporización: L→G.',0,'Estados'),
MC('Paso de sólido a líquido:','Fusión',['Condensación','Sublimación','Solidificación'],'Fusión: S→L, absorbe calor.',0,'Estados'),
MC('Paso de gas a líquido:','Condensación',['Fusión','Vaporización','Sublimación'],'Ocurre en el vaho de un espejo.',0,'Estados'),
MC('La evaporación se diferencia de la ebullición en que…','ocurre solo en la superficie y a cualquier temperatura',['ocurre en todo el líquido','solo a 100 °C','no cambia el estado'],'La ebullición es en todo el líquido y a temperatura fija.',0,'Estados'),
MC('Paso de sólido a gas sin pasar por líquido:','Sublimación',['Fusión','Vaporización','Condensación'],'Sublimación.',0,'Estados'),
MC('Un cambio que absorbe calor:','Fusión',['Solidificación','Condensación','Sublimación inversa'],'Fusión, vaporización y sublimación absorben calor.',0,'Estados'),
MC('Un líquido…','mantiene su volumen y toma la forma del recipiente',['mantiene forma y volumen','cambia de volumen siempre','ocupa todo el recipiente'],'Característica del estado líquido.',0,'Estados'),
TF('En un sólido las partículas están quietas del todo.',0,'Vibran en posiciones fijas.','Estados')];
const GS=t=>`<svg viewBox="0 0 200 140" width=200><path d="M30 10V120H190" stroke="#fff" fill=none stroke-width=2 />${t==0?'<path d="M40 20Q60 100 180 112" stroke="#20C7B5" fill=none stroke-width=4 />':'<path d="M40 110L180 25" stroke="#F3A847" stroke-width=4 />'}<text x=110 y=136 fill="#fff" font-size=12>${['Volumen','Temperatura','Temperatura'][t]}</text><text x=2 y=70 fill="#fff" font-size=12 transform="rotate(-90 12 70)">${['Presión','Volumen','Presión'][t]}</text></svg>`;
const B3=[MC('Jeringa cerrada con temperatura constante. Si apretamos el émbolo, la presión…','aumenta',['disminuye','no cambia'],'Menos volumen: más choques por pared.',['Es la ley de Boyle-Mariotte.','Volumen y presión son inversos.','Menos volumen implica más choques.'],'Gases'),
MC('Con temperatura constante aumentamos el volumen. La presión…','disminuye',['aumenta','no cambia'],'Los choques son menos frecuentes.',0,'Gases'),
MC('Un globo se calienta a presión constante. Su volumen…','aumenta',['disminuye','no cambia'],'Ley de Charles: relación directa.',0,'Gases'),
MC('Un bote rígido cerrado se calienta. La presión…','aumenta',['disminuye','no cambia'],'Ley de Gay-Lussac: volumen constante.',0,'Gases'),
MC('¿Qué magnitud es constante en la ley de Boyle-Mariotte?','La temperatura',['La presión','El volumen'],'Relaciona P y V.',0,'Gases'),
MC('¿Qué magnitud es constante en la ley de Charles?','La presión',['La temperatura','El volumen'],'Relaciona V y T.',0,'Gases'),
MC('¿Qué magnitud es constante en la ley de Gay-Lussac?','El volumen',['La temperatura','La presión'],'Relaciona P y T.',0,'Gases'),
MC('Presión y volumen (T constante) tienen una relación…','inversa',['directa','nula'],'Uno sube y el otro baja.',0,'Gases'),
MC('Volumen y temperatura (P constante) tienen una relación…','directa',['inversa','nula'],'Ambos suben a la vez.',0,'Gases'),
MC('Un globo se encoge en la nevera. ¿Qué ley?','Charles',['Boyle-Mariotte','Gay-Lussac'],'Baja la temperatura y baja el volumen.',0,'Gases'),
MC('Un aerosol explota cerca del fuego. ¿Qué ley?','Gay-Lussac',['Boyle-Mariotte','Charles'],'Volumen fijo, sube T y sube P.',0,'Gases'),
MC('Al comprimir un gas aumenta la presión porque las partículas…','chocan más veces contra las paredes',['se hacen mayores','se enfrían','se detienen'],'Hay menos espacio.',0,'Gases'),
MC('Error: «Enfriamos un gas en un recipiente rígido y la presión aumenta». Correcto:','la presión disminuye',['el volumen aumenta','la presión no cambia'],'Gay-Lussac: más frío, menos presión.',0,'Gases'),];
const B4=[MC('¿Qué instrumento mide el volumen de un líquido?','Probeta',['Balanza','Termómetro'],'La probeta tiene escala en mL.',0,'Densidad'),
MC('Orden correcto para la densidad de una piedra:','masa → volumen inicial → volumen final → d = m/V',['d = m/V → masa → volumen','volumen final → masa → agua','masa → agua → temperatura'],'Primero se mide, después se calcula.',0,'Densidad'),
MC('Dos piezas con la misma densidad…','pueden ser del mismo material',['son de materiales distintos','tienen igual masa siempre'],'La densidad es específica.',0,'Densidad'),
MC('Una pieza mide d = 2,7 g/cm³. Según la tabla es…','aluminio',['hierro (7,8)','cobre (8,9)'],'Compara con la tabla.',0,'Densidad')];
const D=[0.8,0.9,1.2,1.5,2.5,2.7,7.8,8.9];
function gen(k){const d=pick(D),V=R(2,20)*5,m=+(d*V).toFixed(1),V2=R(2,20)*50,m2=+(d*V2).toFixed(1),n={tag:'Densidad'};
const N=(q,num,u,e,h)=>Object.assign(n,{q,num,u,e,h:h||['Recuerda la fórmula de densidad.','Escribe la fórmula y despeja la incógnita.','Sustituye los datos con sus unidades.']});
switch(k){
case 0:return N(`Una pieza tiene masa ${fmt(m)} g y volumen ${V} cm³. Calcula su densidad.`,d,'g/cm³',`d = m / V = ${fmt(m)} / ${V} = ${fmt(d)} g/cm³`);
case 1:return N(`Un material tiene densidad ${fmt(d)} g/cm³. ¿Qué masa tienen ${V} cm³?`,m,'g',`m = d × V = ${fmt(d)} × ${V} = ${fmt(m)} g`);
case 2:return N(`Una pieza de ${fmt(m)} g tiene densidad ${fmt(d)} g/cm³. Calcula su volumen.`,V,'cm³',`V = m / d = ${fmt(m)} / ${fmt(d)} = ${V} cm³`);
case 3:return N(`Un objeto de ${fmt(m2/1000)} kg ocupa ${V2} cm³. Calcula su densidad en g/cm³.`,d,'g/cm³',`m = ${fmt(m2)} g; d = ${fmt(m2)} / ${V2} = ${fmt(d)} g/cm³`);
case 4:return N(`Un líquido tiene densidad ${fmt(d)} g/cm³. Exprésala en kg/m³.`,d*1000,'kg/m³',`1 g/cm³ = 1000 kg/m³ → ${fmt(d)} × 1000 = ${fmt(d*1000)} kg/m³`);
case 5:return N(`Un líquido tiene densidad ${fmt(d)} g/cm³. ¿Qué volumen ocupan ${fmt(m2/1000)} kg? Exprésalo en cm³.`,V2,'cm³',`m = ${fmt(m2)} g; V = m / d = ${fmt(m2)} / ${fmt(d)} = ${V2} cm³`);
case 6:{const mv=R(5,10)*10,mt=+(mv+m).toFixed(1);return N(`Un vaso vacío pesa ${mv} g. Con ${V} cm³ de líquido pesa ${fmt(mt)} g. Calcula la densidad del líquido.`,d,'g/cm³',`m líquido = ${fmt(mt)} − ${mv} = ${fmt(m)} g; d = ${fmt(m)} / ${V} = ${fmt(d)} g/cm³`)}

function simP(){const cv=document.getElementById('cv');if(!cv)return;const c=cv.getContext('2d'),W=520,H=400,ps=[];for(let i=0;i<30;i++)ps.push({hx:70+(i%6)*70,hy:60+Math.floor(i/6)*60,x:70+(i%6)*70,y:60+Math.floor(i/6)*60,vx:Math.random()*2-1,vy:Math.random()*2-1});
let id;const f=()=>{const T=S.tp??-50,s=T<0?0:T<100?1:2,sp=[0,1.3,3.2][s]*(.7+Math.abs(T)/150);const a=document.getElementById('st');if(a)a.textContent=['Sólido','Líquido','Gas'][s];const e=document.getElementById('ex');if(e)e.textContent=['Las partículas vibran en posiciones fijas.','Se desplazan sin separarse mucho.','Están muy separadas y se mueven libres.'][s];

function gasVals(){const g=GM;if(g.mode==0){g.T=300}if(g.mode==1){g.V=60*g.T/300}if(g.mode==2){g.V=60}g.P=100*(g.T/300)*(60/g.V)}

function gIn(v){const g=GM;if(g.mode==0)g.V=+v;else g.T=+v;gasVals();g.pts.push([g.mode==0?g.V:g.T,g.mode==1?g.V:g.P]);if(g.pts.length>80)g.pts.shift();
const base=g.mode==0?g.V0:g.T0;const cur=g.mode==0?g.V:g.T;const el=document.getElementById('gr');
if(cur>base&&g.pred!=null){const real=g.mode==1?(g.V>60*g.T0/300?0:2):(g.mode==0?(g.P<100*(g.T/300)*(60/g.V0)?1:2):(g.P>100*(g.T0/300)?0:2));const ok=real==g.pred;g.res=(ok?'✔ Predicción correcta. ':'✘ Tu predicción no era correcta. ')+['Boyle: menos espacio, más choques: P sube; más espacio, P baja.','Charles: más temperatura, partículas más rápidas: el volumen aumenta.','Gay-Lussac: más temperatura, más choques y más fuertes: la presión aumenta.'][g.mode]}
else g.res='Aumenta el control para comprobar tu predicción.';if(el)el.innerHTML=`<div class="fb1 hn">${g.res}</div>`}
function simG(){const cv=document.getElementById('cv');if(!cv)return;const c=cv.getContext('2d'),g=GM;if(!g.ps||g.ps.length!=30)g.ps=Array.from({length:30},()=>({x:Math.random()*300+40,y:Math.random()*100+260,a:Math.random()*6.28}));

const sv=(i,t)=>{const e=document.getElementById(i);if(e)e.textContent=t};sv('iP',arr(g.P,100)+' '+Math.round(g.P)+' kPa*');sv('iV',arr(g.V,60)+' '+Math.round(g.V)+' mL*');sv('iT',arr(g.T,300)+' '+Math.round(g.T)+' K*');
c.clearRect(0,0,420,400);c.strokeStyle='#fff';c.lineWidth=4;c.strokeRect(40,40,340,320);c.fillStyle='#8fa6d0';c.fillRect(40,top-10,340,14);c.fillRect(205,20,10,top-20);
c.fillStyle='#20C7B5';g.ps.forEach(p=>{p.x+=Math.cos(p.a)*sp;p.y+=Math.sin(p.a)*sp;if(p.x<48||p.x>372){p.a=Math.PI-p.a}if(p.y<top+6||p.y>352){p.a=-p.a}p.x=Math.min(372,Math.max(48,p.x));p.y=Math.min(352,Math.max(top+6,p.y));c.beginPath();c.arc(p.x,p.y,7,0,7);c.fill()});
const gc=document.getElementById('gc');if(gc){const q=gc.getContext('2d');q.clearRect(0,0,240,130);q.strokeStyle='#fff';q.strokeRect(10,5,220,110);q.fillStyle='#F3A847';const r=g.mode==0?[30,100,0,250]:[250,450,g.mode==1?20:20,g.mode==1?120:400];g.pts.forEach(p=>{const X=10+(p[0]-r[0])/(r[1]-r[0])*220,Yv=g.mode==0?p[1]:g.mode==1?p[1]:p[1];const Y=g.mode==1?115-(Yv-20)/(110-20)*100:115-Math.min(1,Yv/(g.mode==0?250:200))*105;q.fillRect(X-2,Y-2,4,4)});q.fillStyle='#fff';q.font='11px sans-serif';q.fillText(['P frente a V','V frente a T','P frente a T'][g.mode],14,126)}
